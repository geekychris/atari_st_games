title = Block Breaker 3D
dir = block_breaker_3d
program = BBREAK3D.PRG
machine = falcon
options = --cpulevel 6 --cpuclock 32 --addr24 off --ttram 64 --dsp none --memsize 14 --monitor vga
screenshot = docs/play_060.png
description = Breakout down a tunnel: a paddle that moves in two directions,
    bricks 3 deep, capsules, eight levels.
    Needs an accelerated Falcon (68060).
controls = Cursor keys / WASD or joystick: move the paddle
    Space / fire: serve, B: autopilot, P: pause
    Help / H: rules, Esc: title / quit

[marble_tilt]
title = Marble Tilt
