    F1 / F2: 1 or 2 players, Esc: title / quit

[bullion_dash]
title = Bullion Dash
dir = bullion_dash
program = BULLION.PRG
machine = ste
screenshot = docs/level1.png
description = Puzzle platformer: collect the gold, dig traps for the guards,
