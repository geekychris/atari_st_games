    Space, Return, Enter or fire: start / back; Esc: quit

[miner_meteor]
title = Miner Meteor
dir = miner_meteor
program = MINER.PRG
machine = falcon
options = --dsp none --memsize 14 --monitor vga
screenshot = docs/level2.png
description = Single-screen platformer: collect the keys, reach the exit
    before the air runs out. Falcon030 true colour.
    F1 on the title: demo of level 1.
controls = Cursor left/right, A/D or joystick: walk
