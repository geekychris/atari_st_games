; Game launcher configuration: tools/games/launcher.py reads this file.
;
; [launcher] holds global settings.  Each other section is one game; its
; name is the id used on the command line (launcher.py --play <id>).
;
; Game keys:
;   title        name shown in the list
;   dir          port directory, relative to this file
;   program      the program's 8.3 name in <dir>/build (started as C:\program)
;   machine      st, ste, megaste, tt or falcon
;   tos          TOS image, relative to the repository (optional; default
;                by machine: EmuTOS 192k for st, 1024k otherwise)
;   options      extra Hatari options (optional)
;   screenshot   image shown in the launcher, relative to <dir> (PNG)
;   description  one or more lines of text (indent continuation lines)
;   controls     the same
;
; The [launcher] keys:
;   cross        cross compiler prefix for building (empty: $CROSS, then
;                m68k-atari-mintelf- on PATH)
;   build        yes: run make in the game's directory before starting
;                (quick when it is up to date)
;   sound        on or off: Hatari's host audio
;   port         agent API port

[launcher]
cross = ~/computers/atari-cc/opt/cross-mint/bin/m68k-atari-mintelf-
build = yes
sound = on
port = 7777

[uranus_lander]
title = Uranus Lander
dir = uranus_lander
program = URANUS.PRG
machine = st
screenshot = docs/flight.png
description = Land on the pads of Uranus without running out of fuel.
    YM2149 sound and music. Has an autopilot (see the README).
controls = Cursor keys / A,D or joystick: rotate
    Space / W, fire or up: thrust
    M: music on/off, Esc: quit

[nova_defense]
title = Nova Defense
dir = nova_defense
program = NOVA.PRG
machine = st
screenshot = docs/battle.png
description = Space Invaders-style: 55 aliens, shields and a mystery ship.
controls = Mouse, cursor keys / A,D or joystick: move
    Left button, Space, Alt or fire: shoot
    Esc: quit

[frank_the_frog]
title = Frank the Frog
dir = frank_the_frog
program = FROG.PRG
machine = st
screenshot = docs/playfield.png
description = Frogger-style: cross the road and the river to reach home.
    The original's generated heavy-metal track on the YM2149.
controls = Cursor keys or joystick: hop
    Space / Return / fire: start
    M: music on/off, Esc: quit

[rock_blaster]
title = Rock Blaster
dir = rock_blaster
program = ROCKBLST.PRG
machine = ste
screenshot = docs/play.png
description = Asteroids-style rock shooter.
controls = Cursor keys, A/Z, D/C or joystick: rotate
    Up, W or joystick up: thrust
    Space, Alt or fire: shoot, Esc: quit

[orbital_patrol]
title = Orbital Patrol
dir = orbital_patrol
program = OPATROL.PRG
machine = ste
screenshot = docs/flight.png
description = Defender-style: protect the humans from abductors.
    MOD music on the STE's DMA sound.
controls = Cursor keys, WASD or joystick: fly
    Space, Alt, Shift or fire: shoot
    Z: smart bomb, H or X: hyperspace, Esc: quit

[jump_quest]
title = Jump Quest
dir = jump_quest
program = JUMPQST.PRG
machine = ste
screenshot = docs/level1.png
description = Platformer with RJ and Dale, one or two players.
controls = Cursor keys, WASD or joystick: move
    Space, Alt, Z, X or fire: jump
    Return: start, Esc: quit

[stakattack]
title = StakAttack
dir = stakattack
program = STAKATTK.PRG
machine = ste
screenshot = docs/play.png
description = Falling-block puzzle with Korobeiniki as MOD music.
controls = Cursor keys / WASD or joystick: move, up / W: rotate
    Down / S: soft drop, Space / fire: hard drop
    P: pause, Esc: quit

[dot_chase]
title = Dot Chase
dir = dot_chase
program = DOTCHASE.PRG
machine = ste
screenshot = docs/play.png
description = Maze dot-eater with four ghosts.
controls = Cursor keys / WASD or joystick: move
    Space / Return / fire: start, Esc: quit

[lunar_rider]
title = Lunar Rider
dir = lunar_rider
program = LUNARRDR.PRG
machine = ste
screenshot = docs/ride.png
description = Moon Patrol-style buggy ride: jump craters, shoot rocks.
    Scrolled with the STE blitter.
controls = Left / right (or D): slow down / speed up
    Up, W, Space or joystick up: jump
    A or fire: shoot, Esc: quit

[pea_shooter_blast]
title = Pea Shooter Blast
dir = pea_shooter_blast
program = PEASHOOT.PRG
machine = ste
screenshot = docs/enemies.png
description = Side-scrolling tank action over three levels.
    Sound effects only, unless you add your own build/MUSIC.MOD.
controls = A/D, cursor keys or joystick: move
    W, up or joystick up: jump
    Space, Alt or fire: shoot (one shot per press), Esc: quit

[fractalus]
title = Rescue on Fractalus
dir = fractalus
program = FRACTAL.PRG
machine = falcon
options = --dsp none --memsize 14 --monitor vga
screenshot = docs/flight.png
description = Fly over fractal terrain and rescue downed pilots.
    Falcon030 true colour.
controls = A/D or left/right: turn, W/up: thrust, S/down: brake
    Q/Z: pitch, Space: fire / start, L: land
    Return: restart, Esc: quit

[void_trader]
title = Void Trader
dir = void_trader
program = VTRADER.PRG
machine = falcon
options = --dsp none --memsize 14 --monitor vga
screenshot = docs/combat.png
description = Elite-style space combat and trading in filled 3D.
    Earn 5000 credits to win. Falcon030 true colour.
controls = W/S pitch, A/D yaw, Q/E roll, R/F thrust
    Space: fire / start, Tab: dock, U: undock
    Docked: W/S select, B buy, N sell, Esc: quit

[sky_knights]
title = Sky Knights
dir = sky_knights
program = SKYKNGHT.PRG
machine = ste
screenshot = docs/play.png
description = Joust-style aerial combat on winged mounts, one or two players.
    Strike from above, grab the pods before they hatch.
controls = P1: cursor keys / A,D move, up / W / Space flap
    P2: joystick, up or fire flaps
    F1 / F2: 1 or 2 players, Esc: quit

[orb_hunter]
title = Orb Hunter
dir = orb_hunter
program = ORBHUNTR.PRG
machine = ste
screenshot = docs/citadel.png
description = Metroid-style exploration: rooms, power-ups and bosses.
    Sound effects only, unless you add your own build/AXELF.MOD.
controls = Cursor keys / WASD or joystick: move
    Up: jump / aim up, down: roll form
    Space / Alt / fire: shoot, Return: start, Esc: quit

[ace_pilot]
title = Ace Pilot
dir = ace_pilot
program = ACEPILOT.PRG
machine = falcon
options = --dsp none --memsize 14 --monitor vga
screenshot = docs/colour.png
description = 3D wireframe biplane dogfights, Blue Danube MOD music.
    Split-screen two players. Falcon030 true colour.
controls = Cursor keys / WASD or joystick: fly, Space: shoot
    Q / E: throttle, P (title): display mode
    F1 / F2: 1 or 2 players, Esc: title / quit

[bullion_dash]
title = Bullion Dash
dir = bullion_dash
program = BULLION.PRG
machine = ste
screenshot = docs/level1.png
description = Lode Runner-style: collect the gold, dig traps, escape.
    With the built-in level editor (E on the title).
controls = Cursor keys or joystick: run and climb
    Space / Return / fire + left or right: dig
    Fire: start, E: editor, Esc: quit

[rj_birthday]
title = RJ's Birthday Bash
dir = rj_birthday
program = RJBDAY.PRG
machine = ste
options = --memsize 2
screenshot = docs/foyer.png
description = Run RJ Mical's 70th birthday party across six rooms.
    Music only with make assets (see the README).
controls = Cursor keys or joystick: move, Space / fire: act
    Title: H help, E guests, Q quit
    Esc: leave the party
