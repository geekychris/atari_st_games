; The amiga3d engine games (../a3d_falcon): the Amiga originals' 3D in
; software, 25 frames a second with a 68060. A stock Falcon030 runs the
; same programs at 1-15 fps (each README has its figure), so they start
; on an accelerated Falcon like Rolling Steel and Planet Chomp.

