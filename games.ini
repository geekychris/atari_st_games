    Space / Return / fire + left or right: dig
    Fire: start, E: editor, Esc: quit

[rj_birthday]
title = RJ's Birthday Bash
dir = rj_birthday
program = RJBDAY.PRG
machine = ste
options = --memsize 2
screenshot = docs/foyer.png
description = Run RJ Mical's 70th birthday party across six rooms.
    Original party music, Happy Birthday and arcade voices on DMA sound.
controls = Cursor keys or joystick: move, Space / fire: act
    Title: H help, E guests, Q quit
    Esc: leave the party

[spectral_keep]
title = Spectral Keep
dir = spectral_keep
program = SPECKEEP.PRG
machine = falcon
options = --dsp none --memsize 14 --monitor vga
screenshot = docs/play.png
description = Isometric flip-screen adventure: three keeps,
    24 rooms. Carry the relics to the throne. Falcon030 true colour.
controls = Cursor keys / WASD or joystick: walk, Space: jump / start
    Title: up/down keep, C controls, M music. P: pause, Esc: quit

; Rolling Steel and Planet Chomp draw their 3D in software for a 68020
; or better at Amiga 68060 speeds: a stock Falcon030 manages 1-2 fps, so
; they run on an accelerated (CT60-style) Falcon: 68060 at 32 MHz with
; 64 MB of TT-RAM (which needs the 32-bit address bus)

[rolling_steel]
title = Rolling Steel
dir = rolling_steel
program = ROLLSTL.PRG
machine = falcon
options = --cpulevel 6 --cpuclock 32 --addr24 off --ttram 64 --dsp none --memsize 14 --monitor vga
screenshot = docs/play.png
description = Roll a marble down six floating isometric courses against one
    clock. Needs an accelerated Falcon (68060).
controls = Cursor keys or joystick: push, Z / X: turn the view
    +/-: zoom, C + up/down: tilt, F: display mode (fast / depth buffer)
    P: pause, Esc: quit
    Title: up/down course, left/right players, C music, Space: start

[planet_chomp]
title = Planet Chomp
dir = planet_chomp
program = PCHOMP.PRG
machine = falcon
options = --cpulevel 6 --cpuclock 32 --addr24 off --ttram 64 --dsp none --memsize 14 --monitor vga
screenshot = docs/play.png
description = Maze chase on a tiny planet: the maze wraps round a sphere. Grab
    a golden key to turn the tables. Needs an accelerated Falcon (68060).
controls = Cursor keys / WASD or joystick: steer, Q / E: spin the view
    C: whole planet, P: pause, Space: start, Esc: quit

[emberkeep]
title = Emberkeep
dir = emberkeep
program = EMBERKEE.PRG
machine = falcon
options = --dsp none --memsize 14 --monitor vga
screenshot = docs/level2.png
description = Top-down cavern explorer by lantern light: collect the runes,
    keep the lamp fuelled with oil, reach the exit portal.
    Falcon030 true colour. F1 on the title: demo of level 1.
controls = Cursor keys / WASD or joystick: walk
    Space or fire: start / back to the title, F1: demo, Esc: quit

[warden_keep]
title = Warden Keep
dir = warden_keep
program = WARDEN.PRG
machine = falcon
options = --dsp none --memsize 14 --monitor vga
screenshot = docs/play.png
description = Isometric room adventure: push the barrels and collect
    the three jewels. Falcon030 true colour.
controls = Cursor keys, WASD, IJKL, keypad 8/4/6/2 or joystick: step one
